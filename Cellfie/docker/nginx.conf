# The web app under /app/ and the API under /api/, on one origin, as the
# dev server serves them (scripts/flutter-web.sh).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Relative redirects, so they keep the published port, not 8080.
    absolute_redirect off;

    location = / {
        return 302 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location /api/ {
        proxy_pass http://api:8931;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64k;
        # Longer than the API's 90 s wait for aityx (bin/server.dart), so a
        # slow generation still answers rather than timing out here.
        proxy_read_timeout 100s;
    }
}

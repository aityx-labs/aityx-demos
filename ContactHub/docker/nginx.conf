# The web app under /app/ and the API under /api/, on one origin, as the
# dev server serves them (scripts/flutter-web.sh).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Relative redirects, so they keep the published port, not 8080.
    absolute_redirect off;

    location = / {
        return 302 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location /api/ {
        proxy_pass http://api:8891;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64k;
        # Allow the API's 100 s route budget to return before nginx times out.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

        <path d="M62 150 H106 L126 108 L154 196 L178 150 H258" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      </mask>
    </defs>
    <path fill="#E36742" mask="url(#pulse)" d="M160 292 C70 222 20 174 20 108 C20 62 54 28 96 28 C123 28 146 42 160 64 C174 42 197 28 224 28 C266 28 300 62 300 108 C300 174 250 222 160 292 Z"/>

# Stream processing: compose.yaml's flink-jobmanager, flink-taskmanager and
# flink-sql, one image (flink/Dockerfile: Flink 2.2 with the Kafka and JDBC
# connectors and the job). A session cluster of one JobManager and one
# TaskManager runs the healthhub-admissions-hourly job, which counts the
# admissions per hospital and simulated hour into the
# healthhub.admissions.hourly topic and the admissions_hourly table;
# healthhub-flink-sql submits it, and again whenever the cluster lost it
# (flink/submit.sh). No state survives a restart: the job is resubmitted
# and recounts what the topic keeps.
#
# The settings (flink.properties, the healthhub-flink ConfigMap) are
# compose's, with the JobManager's two Services as its addresses: its RPC
# and blob server at healthhub-flink-rpc, its web UI and REST API at
# healthhub-flink-jobmanager, published on the node (31806, the host's
# 19806). The memory sizes are the processes' whole footprint, as Flink's
# own Kubernetes integration sizes its pods.
apiVersion: v1
kind: Service
metadata:
  name: healthhub-flink-jobmanager
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: healthhub-flink-jobmanager
  ports:
    - name: rest
      port: 8081
      targetPort: rest
      nodePort: 31806
---
apiVersion: v1
kind: Service
metadata:
  name: healthhub-flink-rpc
spec:
  selector:
    app.kubernetes.io/name: healthhub-flink-jobmanager
  ports:
    - name: rpc
      port: 6123
      targetPort: rpc
    - name: blob
      port: 6124
      targetPort: blob
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthhub-flink-jobmanager
  labels:
    aityx-demos/build: local
spec:
  replicas: 1
  # One JobManager at a time: a second would run the job beside the first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: healthhub-flink-jobmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthhub-flink-jobmanager
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
      containers:
        - name: jobmanager
          image: localhost:5001/aityx-demos/healthhub-flink:dev
          imagePullPolicy: Always
          args: ["jobmanager"]
          env:
            - name: FLINK_PROPERTIES
              valueFrom:
                configMapKeyRef: { name: healthhub-flink, key: FLINK_PROPERTIES }
          ports:
            - name: rest
              containerPort: 8081
            - name: rpc
              containerPort: 6123
            - name: blob
              containerPort: 6124
          # compose.yaml's health check.
          readinessProbe:
            httpGet:
              path: /overview
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /overview
              port: rest
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthhub-flink-taskmanager
  labels:
    aityx-demos/build: local
spec:
  replicas: 1
  # One slot is all the job needs; two TaskManagers would double the memory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: healthhub-flink-taskmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthhub-flink-taskmanager
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
      containers:
        - name: taskmanager
          image: localhost:5001/aityx-demos/healthhub-flink:dev
          imagePullPolicy: Always
          args: ["taskmanager"]
          env:
            - name: FLINK_PROPERTIES
              valueFrom:
                configMapKeyRef: { name: healthhub-flink, key: FLINK_PROPERTIES }
          ports:
            - name: rpc
              containerPort: 6122
          # compose.yaml has no health check for it; its RPC port answers
          # once it is up.
          readinessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthhub-flink-sql
  labels:
    aityx-demos/build: local
spec:
  replicas: 1
  # One submitter at a time, so the job is never submitted twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: healthhub-flink-sql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthhub-flink-sql
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
      containers:
        - name: flink-sql
          image: localhost:5001/aityx-demos/healthhub-flink:dev
          imagePullPolicy: Always
          args: ["/opt/flink/healthhub/submit.sh"]
          env:
            - name: FLINK_PROPERTIES
              valueFrom:
                configMapKeyRef: { name: healthhub-flink, key: FLINK_PROPERTIES }
            # Where submit.sh asks for the job, and where the job reads and
            # writes (compose's names otherwise).
            - name: FLINK_REST_URL
              value: http://healthhub-flink-jobmanager:8081
            - name: HEALTHHUB_KAFKA_BOOTSTRAP
              value: healthhub-kafka:19092
            - name: HEALTHHUB_DB_HOST
              value: healthhub-postgres
            - name: HEALTHHUB_DB_PORT
              value: "5432"
            - name: HEALTHHUB_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: healthhub-db, key: password }
            # The SQL client, a JVM run at each submission, the only one
            # here: a heap of most of the limit.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60
          # compose.yaml's health check: ready while the job is on the
          # cluster.
          readinessProbe:
            exec:
              command: ["/opt/flink/healthhub/submit.sh", "check"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 640Mi }

# The aityx index on the local cluster (k8s/deploy.sh Index): one server,
# aityx-index, in the aityx group's namespace, serving the index page and
# the six aityx demos' web builds, all in its image
# (docker/aityx-index.Dockerfile), with the dev proxy to aityx on the
# key in the demo-env Secret (k8s/secrets.sh):
# http://localhost:18800/demos/.
#
#   deployment.yaml  the server
#   service.yaml     its port, 8800, as NodePort 30800 (127.0.0.1:18800)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aityx

labels:
  - pairs:
      app.kubernetes.io/part-of: index
    includeSelectors: false
    includeTemplates: true

resources:
  - deployment.yaml
  - service.yaml

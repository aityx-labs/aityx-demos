# The index's port, 8800, in the cluster (http://aityx-index.aityx.svc:8800)
# and, through NodePort 30800 that kind publishes on 127.0.0.1:18800, on
# this host: http://localhost:18800/demos/.
apiVersion: v1
kind: Service
metadata:
  name: aityx-index
  labels:
    app.kubernetes.io/name: aityx-index
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: aityx-index
  ports:
    - name: http
      port: 8800
      targetPort: http
      nodePort: 30800

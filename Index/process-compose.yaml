version: "0.5"

processes:
  1-index:
    # The index page's server (bin/server.dart); see scripts/serve.sh. It
    # serves the six aityx demos' web builds too, at /<slug>/, and the
    # dev proxy to aityx: one port for all. The variables are named as
    # the datyx group's services' are, so start-all.sh reads the port the
    # same way. The server reads the root .env itself.
    command: bash scripts/serve.sh
    environment:
      - INDEX_PORT=${FLUTTER_WEB_PORT:-8800}
      - API_PORT=${API_PORT:-8800}
    readiness_probe:
      http_get:
        host: localhost
        port: ${FLUTTER_WEB_PORT:-8800}
        path: /api/health
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 5
      failure_threshold: 60
    availability:
      restart: on_failure
      backoff_seconds: 5

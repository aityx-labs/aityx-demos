# The web app under /app/ and the API under /api/, on one origin, as the
# dev server serves them (scripts/flutter-web.sh).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Relative redirects, so they keep the published port, not 8080.
    absolute_redirect off;

    location = / {
        return 302 /app/;
    }

    location /app/ {
        # The build isn't fingerprinted: revalidate every file, so a new
        # image is seen on the next load (as scripts/flutter-web.sh's server).
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /app/index.html;
    }

    location /api/ {
        proxy_pass http://api:8881;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64k;
    }
}

# Poker Tour with Docker alone: `docker compose up` from this folder, then
# open http://localhost:9810/app/. No devbox or Flutter needed on the host:
# the image builds the app and the server (Dockerfile, with the
# repository's packages/ as a second build context, for aityx_web). The settings come
# from the environment, else this folder's .env (see .env.example): the
# key and the sign-in reach the server only. The tour lives in Floci, the
# local AWS (floci/compose.yaml's, here as a service of this project): its
# S3 and DynamoDB, in the pokertour-floci volume.

name: pokertour

services:
  pokertour:
    build:
      context: .
      additional_contexts:
        packages: ../packages
    environment:
      AITYX_API_KEY: ${AITYX_API_KEY:-}
      POKERTOUR_LEADERBOARD_KEY: ${POKERTOUR_LEADERBOARD_KEY:-}
      AITYX_URL: ${AITYX_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://accounts.google.com}
      OIDC_CLIENT_ID: ${POKERTOUR_OIDC_CLIENT_ID:-${OIDC_CLIENT_ID:-}}
      POKERTOUR_ALLOWED_DOMAINS: ${POKERTOUR_ALLOWED_DOMAINS:-aletyx.com,aletyx.ai}
      POKERTOUR_RUN: ${POKERTOUR_RUN:-on}
      POKERTOUR_SCHEDULE_HOURS: ${POKERTOUR_SCHEDULE_HOURS:-0,6,12,18}
      POKERTOUR_MAX_HANDS: ${POKERTOUR_MAX_HANDS:-300}
      POKERTOUR_MAX_ENTRIES: ${POKERTOUR_MAX_ENTRIES:-3}
      POKERTOUR_AWS_ENDPOINT: http://floci:4566
    depends_on:
      floci:
        condition: service_healthy
    # The image has no shell or curl; the server checks its own /api/health.
    healthcheck:
      test: ["CMD", "/app/bin/server", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      start_interval: 1s
      retries: 3
    # Bound to this host only; set POKERTOUR_BIND_HOST=0.0.0.0 to share it.
    ports:
      - "${POKERTOUR_BIND_HOST:-127.0.0.1}:${FLUTTER_WEB_PORT:-9810}:9810"
    restart: unless-stopped

  floci:
    extends:
      file: floci/compose.yaml
      service: floci
    # The server reaches it on this project's network; no host port.
    ports: !reset []

volumes:
  pokertour-floci:
    name: pokertour-floci

version: "0.5"

# `devbox services up`: Floci, the local AWS (floci/compose.yaml), and the
# Poker Tour server (scripts/serve.sh), one process on one port: the app
# under /pokertour/, its API under /api/, and the leaderboard's tournaments, on
# the schedule or when an admin asks. The server keeps the tour in Floci.
# The variables are named as every demo's, so start-all.sh reads the port
# the same way; the API shares the web port.

processes:
  0-floci:
    # The tour's bucket and table (S3 and DynamoDB), in the Docker volume
    # pokertour-floci; made on the first start (floci/init/ready.d/).
    command: docker compose -f floci/compose.yaml up floci
    environment:
      - POKERTOUR_FLOCI_PORT=${POKERTOUR_FLOCI_PORT:-9811}
    shutdown:
      command: docker compose -f floci/compose.yaml stop floci
      timeout_seconds: 30
    readiness_probe:
      exec:
        command: curl -fs http://localhost:${POKERTOUR_FLOCI_PORT:-9811}/_floci/init | grep -q '"ready":true'
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 5
      # Up to 6 minutes: a first run pulls the image.
      failure_threshold: 180
    availability:
      # Always: when the container is stopped from outside, `compose up`
      # exits 0, and the server would lose its store.
      restart: always
      backoff_seconds: 5

  1-server:
    command: bash scripts/serve.sh
    environment:
      - FLUTTER_WEB_PORT=${FLUTTER_WEB_PORT:-9810}
      - API_PORT=${API_PORT:-9810}
      - POKERTOUR_BIND_HOST=${POKERTOUR_BIND_HOST:-127.0.0.1}
      - AITYX_API_KEY=${AITYX_API_KEY:-}
      - POKERTOUR_LEADERBOARD_KEY=${POKERTOUR_LEADERBOARD_KEY:-}
      - AITYX_URL=${AITYX_URL:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - POKERTOUR_OIDC_CLIENT_ID=${POKERTOUR_OIDC_CLIENT_ID:-}
      - POKERTOUR_ALLOWED_DOMAINS=${POKERTOUR_ALLOWED_DOMAINS:-}
      - POKERTOUR_RUN=${POKERTOUR_RUN:-}
      - POKERTOUR_SCHEDULE_HOURS=${POKERTOUR_SCHEDULE_HOURS:-}
      - POKERTOUR_MAX_HANDS=${POKERTOUR_MAX_HANDS:-}
      - POKERTOUR_MAX_ENTRIES=${POKERTOUR_MAX_ENTRIES:-}
      - POKERTOUR_AWS_ENDPOINT=http://localhost:${POKERTOUR_FLOCI_PORT:-9811}
    depends_on:
      0-floci:
        condition: process_healthy
    # Stopping only the script would leave the server on the port.
    shutdown:
      command: lsof -tiTCP:${FLUTTER_WEB_PORT:-9810} -sTCP:LISTEN | xargs kill 2>/dev/null; true
      timeout_seconds: 10
    readiness_probe:
      http_get:
        host: localhost
        port: ${FLUTTER_WEB_PORT:-9810}
        path: /api/health
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 5
      # Up to 15 minutes: a first start builds the app, and when every
      # demo starts at once (start-all.sh) the builds take turns.
      failure_threshold: 450
    availability:
      restart: on_failure
      backoff_seconds: 5

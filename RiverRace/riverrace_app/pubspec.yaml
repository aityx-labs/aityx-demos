name: riverrace_app
description: "RiverRace"
publish_to: 'none'

# The build scripts override this with X.Y.Z (scripts/version.sh).
version: 1.0.0+1

environment:
  # ^3.13.0, not newer: the Nix Flutter in devbox ships Dart 3.13.0.
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # aityx from the browser, shared by the aityx demos: the key the index
  # page set (or the index server's dev key), the systemone call and the
  # status light.
  aityx_web:
    path: ../../packages/aityx_web
  http: ^1.6.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # The decision model sent to aityx: the types the pilots' tables use
  # (see lib/aityx/decision_request.dart).
  assets:
    - assets/models/river.json
  # The calls panel's monospace font (see assets/fonts/README.md).
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf

# App icons for every platform, generated from assets/icon/ by
# `dart run flutter_launcher_icons`. The masters are SVGs rendered to PNG
# (see specs/app-icon.md).
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: launcher_icon
  # Adaptive icon (Android 8+): the plane on a solid background layer.
  adaptive_icon_background: "#1C3FAA"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#17161A"
    theme_color: "#17161A"

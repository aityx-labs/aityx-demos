# The index's server (bin/server.dart, compiled; docker/datyx-index.Dockerfile)
# serving the page and its /api/ on 9800, every address. It has no
# folders beside it to read, so INDEX_DEMOS names the group's systems
# /api/demos reports on, each with the in-cluster URL that says it's up:
# the datyx API's health check, and the dashboard's and HealthHub's web
# apps. The page asks the server where everything is (/api/settings), so
# the *_PORT settings below say where the cluster publishes each system
# on this host (k8s/kind/cluster.yaml: its usual port plus 10000), and
# INDEX_ON_CLUSTER that this copy is the cluster's, for the page's footer
# and the ports its cards name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datyx-index
  labels:
    app.kubernetes.io/name: datyx-index
    aityx-demos/build: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: datyx-index
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datyx-index
        aityx-demos/build: local
    spec:
      # No variables from the namespace's other Services: the one of
      # datyx-api would be DATYX_API_PORT=tcp://..., a setting of this
      # server (set below, which wins either way).
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: index
          image: localhost:5001/aityx-demos/datyx-index:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9800
          env:
            - name: INDEX_PORT
              value: "9800"
            - name: INDEX_BIND_HOST
              value: 0.0.0.0
            - name: INDEX_DEMOS
              value: datyx=http://datyx-api:9900/api/health,datyx-dashboard=http://datyx-dashboard:9906/app/,HealthHub=http://healthhub:9801/app/
            # What the page links to and names: the host ports of
            # k8s/kind/cluster.yaml, not the Services' own.
            - name: INDEX_ON_CLUSTER
              value: "true"
            - name: DATYX_INDEX_PORT
              value: "19800"
            - name: DATYX_DASHBOARD_WEB_PORT
              value: "19906"
            - name: DATYX_API_PORT
              value: "19900"
            - name: DATYX_OPENMETADATA_PORT
              value: "19902"
            - name: HEALTHHUB_WEB_PORT
              value: "19801"
            - name: HEALTHHUB_FLINK_PORT
              value: "19806"
            - name: AITYX_INDEX_PORT
              value: "18800"
            - name: MULTYX_INDEX_PORT
              value: "19700"
          # process-compose.yaml's readiness probe: /api/health.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

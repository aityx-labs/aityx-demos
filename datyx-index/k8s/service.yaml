# The index's port, 9800, in the cluster (http://datyx-index.datyx.svc:9800)
# and, through NodePort 31800 that kind publishes on 127.0.0.1:19800, on
# this host: http://localhost:19800/.
apiVersion: v1
kind: Service
metadata:
  name: datyx-index
  labels:
    app.kubernetes.io/name: datyx-index
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: datyx-index
  ports:
    - name: http
      port: 9800
      targetPort: http
      nodePort: 31800

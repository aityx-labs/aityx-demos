version: "0.5"

processes:
  1-index:
    # The datyx index page's server (bin/server.dart); see scripts/serve.sh.
    # The variables are named as the demos' are, so start-all.sh reads
    # the port the same way: the page and its /api/ share one port, 9800,
    # the datyx group's range.
    command: bash scripts/serve.sh
    environment:
      - INDEX_PORT=${FLUTTER_WEB_PORT:-9800}
      - API_PORT=${API_PORT:-9800}
    readiness_probe:
      http_get:
        host: localhost
        port: ${FLUTTER_WEB_PORT:-9800}
        path: /api/health
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 5
      failure_threshold: 60
    availability:
      restart: on_failure
      backoff_seconds: 5

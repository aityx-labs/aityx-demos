# The datyx API. Every setting here reads an environment variable with a
# default for a laptop (scripts/api.sh and compose.yaml set them).
quarkus.application.name=datyx

# HTTP: 9900, on this host only in dev; every interface elsewhere (a
# container), unless DATYX_BIND_HOST says otherwise.
quarkus.http.port=${DATYX_API_PORT:9900}
quarkus.http.host=${DATYX_BIND_HOST:0.0.0.0}
%dev.quarkus.http.host=${DATYX_BIND_HOST:localhost}
%test.quarkus.http.test-port=0

# PostgreSQL (compose.yaml's postgres service). The URL is set for dev and
# prod only: tests get a Postgres test container from Dev Services. The
# containers are devbox's or Docker Compose's, never Quarkus's.
quarkus.compose.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATYX_DB_USER:datyx}
quarkus.datasource.password=${DATYX_DB_PASSWORD:datyx}
%dev.quarkus.datasource.jdbc.url=${DATYX_DB_URL:jdbc:postgresql://localhost:9901/datyx}
%prod.quarkus.datasource.jdbc.url=${DATYX_DB_URL:jdbc:postgresql://localhost:9901/datyx}

# OpenMetadata (compose.yaml's openmetadata service): its API, read by
# datyx.openmetadata.OpenMetadataClient for its health check.
quarkus.rest-client.openmetadata.url=${DATYX_OPENMETADATA_URL:http://localhost:9902}
# Tests expect no OpenMetadata, whether or not the stack runs on this host.
%test.quarkus.rest-client.openmetadata.url=http://localhost:1
quarkus.rest-client.openmetadata.connect-timeout=2000
quarkus.rest-client.openmetadata.read-timeout=5000
# datyx's sign-in to OpenMetadata, for the catalogue (datyx.catalog):
# a bot's token (OpenMetadata's Settings > Bots) when set, else basic
# authentication's email and password. Development signs in as the stack's
# built-in admin (compose.yaml); elsewhere set a token, or both.
datyx.openmetadata.token=${DATYX_OPENMETADATA_TOKEN:}
datyx.openmetadata.email=${DATYX_OPENMETADATA_EMAIL:}
datyx.openmetadata.password=${DATYX_OPENMETADATA_PASSWORD:}
%dev.datyx.openmetadata.email=${DATYX_OPENMETADATA_EMAIL:admin@open-metadata.org}
# OpenMetadata's webhook (datyx.catalog.CatalogEvents): datyx keeps an
# event subscription there posting each table update to
# /api/catalog/openmetadata-events at this URL, so a group switched on
# trains at once. Empty: no subscription, the trainer's minute check
# alone (prod, unless set). In dev OpenMetadata runs in Docker and the
# API on the host. The secret OpenMetadata signs its posts with: drawn at
# each start when not set. The subscription's name, one per API.
datyx.openmetadata.callback-url=${DATYX_OPENMETADATA_CALLBACK_URL:}
%dev.datyx.openmetadata.callback-url=${DATYX_OPENMETADATA_CALLBACK_URL:http://host.docker.internal:${quarkus.http.port}/api/catalog/openmetadata-events}
%test.datyx.openmetadata.callback-url=
datyx.openmetadata.webhook-secret=${DATYX_OPENMETADATA_WEBHOOK_SECRET:}
%test.datyx.openmetadata.webhook-secret=test-webhook-secret
datyx.openmetadata.subscription-name=${DATYX_OPENMETADATA_SUBSCRIPTION:datyx-catalog-events}
%dev.datyx.openmetadata.password=${DATYX_OPENMETADATA_PASSWORD:admin}

# Kafka: the client library reads a Kafka source's topics for the
# catalogue (datyx.catalog.StreamReader), with each source's own servers.
# datyx has no broker of its own: no Kafka container from Dev Services.
quarkus.kafka.devservices.enabled=false

# The schema: Flyway's migrations (src/main/resources/db/migration), run at
# every start, in every profile, so a fresh database (Docker alone, a jar
# or the native executable on a new volume) gets its tables; Hibernate
# only checks that the entities match. A database made by Hibernate
# before Flyway (an older dev checkout) is baselined as version 1. Tests
# and the dev profile start from a clean schema: every start drops
# everything in it and migrates from zero. The dev profile (quarkus:dev,
# and Docker Compose's default) adds db/devdata: the
# development data, Java migrations (package db.devdata) seeding records
# that prod never gets, such as the HealthHub database as a data source.
quarkus.flyway.locations=db/migration
%dev.quarkus.flyway.locations=db/migration,db/devdata
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
%test.quarkus.flyway.clean-at-start=true
%dev.quarkus.flyway.clean-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Health at /api/health (and /live, /ready, /started): the path the
# repository's start-all.sh checks, directly and through the dashboard's
# proxy (datyx-dashboard/).
quarkus.smallrye-health.root-path=/api/health
# Its checks: the database's and OpenMetadata's (datyx.status.
# OpenMetadataHealthCheck), off in tests, which run without OpenMetadata.
%test.quarkus.smallrye-health.check."datyx.status.OpenMetadataHealthCheck".enabled=false

# The API's description: /q/openapi, and Swagger UI at /q/swagger-ui in dev.
quarkus.smallrye-openapi.info-title=datyx API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}

# The native executable's name, so scripts find it: target/datyx-runner.
quarkus.package.output-name=datyx

# Authentication: OpenID Connect, Google first. The apps sign the user in
# with the issuer and client id from GET /api/auth/config and send the ID
# token as a bearer; this extension verifies it against the issuer's keys.
# Without OIDC_CLIENT_ID authentication is off and every path is open
# (datyx.auth.AuthConfigSourceFactory derives quarkus.oidc.tenant-enabled
# and the secured policy from the client id); with it, the secured paths
# need a signed-in user. The principal is the email claim.
datyx.oidc.issuer=${OIDC_ISSUER:https://accounts.google.com}
datyx.oidc.client-id=${OIDC_CLIENT_ID:}
# Other clients whose tokens are accepted too (HealthHub's), comma-separated:
# the factory adds them to the client id as quarkus.oidc.token.audience.
datyx.oidc.extra-audiences=${OIDC_EXTRA_AUDIENCES:}
quarkus.oidc.auth-server-url=${datyx.oidc.issuer}
quarkus.oidc.client-id=${datyx.oidc.client-id}
quarkus.oidc.application-type=service
quarkus.oidc.token.principal-claim=email
# The issuer is always set (Google by default): no Keycloak container from Dev Services.
quarkus.keycloak.devservices.enabled=false
quarkus.http.auth.permission.secured.paths=/api/datasources,/api/datasources/*,/api/me,/api/profile,/api/profile/*,/api/training,/api/training/*,/api/inference,/api/inference/*,/api/catalog/events,/api/aityx,/api/aityx/*
# The aityx gateway (datyx.aityx): a signed-in user, as the secured paths,
# or a service presenting DATYX_SERVICE_TOKEN in X-Datyx-Service-Token
# without signing in (datyx.aityx.AityxGatewayPolicy). The more specific
# path wins over /api/aityx/*.
quarkus.http.auth.permission.aityx-gateway.paths=/api/aityx/v1/*
quarkus.http.auth.permission.aityx-gateway.policy=aityx-gateway
# OpenMetadata's webhook signs its posts instead of signing in: open, and
# checked by its signature (datyx.catalog.CatalogEventResource).
quarkus.http.auth.permission.openmetadata-webhook.paths=/api/catalog/openmetadata-events
quarkus.http.auth.permission.openmetadata-webhook.policy=permit

# Encryption at rest (datyx.crypto.Crypto): the master key wrapping every
# profile's key, 32 bytes in base64 (`openssl rand -base64 32`). Required
# in prod (a jar, the native executable, Docker); dev and test modes fall
# back to a development key, with a warning. Tests use a fixed one.
datyx.master-key=${DATYX_MASTER_KEY:}
%test.datyx.master-key=dGVzdC1tYXN0ZXIta2V5LWZvci1kYXR5eC10ZXN0cyE=
# Training (datyx.training): the trainer started with the API checks the
# catalogue for groups tagged for XGBoost every minute, the first time a
# few seconds after start, and trains those due. Off in tests, which train
# by hand.
datyx.training.enabled=${DATYX_TRAINING_ENABLED:true}
%test.datyx.training.enabled=false

# aityx (datyx.aityx, specs/aityx.md): the gateway to aityx's
# /v1/systemone, with datyx's key (a secret, never logged nor answered;
# empty, the gateway answers 503), at aityx's URL. The token services
# present instead of signing in (a secret; empty, service calls are
# refused). Whether every profile sees the services' calls: in dev mode,
# where the datyx group's HealthHub is everyone's.
datyx.aityx.key=${AITYX_API_KEY:}
datyx.aityx.url=${DATYX_AITYX_URL:https://api.aityx.ai}
datyx.aityx.timeout=60S
datyx.service-token=${DATYX_SERVICE_TOKEN:}
datyx.aityx.share-service-calls=${DATYX_AITYX_SHARE_SERVICE_CALLS:false}
%dev.datyx.aityx.share-service-calls=${DATYX_AITYX_SHARE_SERVICE_CALLS:true}
# Tests call no aityx and present no token unless a test profile says so.
%test.datyx.aityx.key=
%test.datyx.aityx.url=http://localhost:1
%test.datyx.service-token=

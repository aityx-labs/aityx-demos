# The datyx API (build.sh's image, the dev profile as compose.yaml builds
# it): http://datyx-api:9900 in the cluster, which datyx-dashboard and
# HealthHub call, and http://localhost:19900 on this host.
apiVersion: v1
kind: Service
metadata:
  name: datyx-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: datyx-api
  ports:
    - name: http
      port: 9900
      targetPort: http
      nodePort: 31900
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datyx-api
  labels:
    aityx-demos/build: local
spec:
  replicas: 1
  # The dev profile empties the database at every start: one API at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: datyx-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datyx-api
        aityx-demos/build: local
    spec:
      # The Service datyx-api would put DATYX_API_PORT=tcp://... in the
      # environment, where the API reads its port.
      enableServiceLinks: false
      # The image's user, nobody.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      initContainers:
        # compose.yaml's depends_on (postgres healthy): the API empties and
        # migrates the schema at its start, and exits when PostgreSQL
        # doesn't take the connection, a restart on every new cluster.
        # The API's own image has bash; OpenMetadata may still be starting,
        # which the API waits out by itself (its readiness).
        - name: wait-for-postgres
          image: localhost:5001/aityx-demos/datyx-api:dev
          imagePullPolicy: Always
          command: ["bash", "-c"]
          args:
            - |
              until (exec 3<>/dev/tcp/datyx-postgres/5432) 2>/dev/null; do
                echo "waiting for datyx-postgres"
                sleep 2
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      containers:
        - name: api
          image: localhost:5001/aityx-demos/datyx-api:dev
          imagePullPolicy: Always
          # The image's command, after two settings:
          # - aityx's URL (staging, from the root .env) comes with its key;
          #   without it the key isn't lent to production's default URL,
          #   where it would be refused.
          # - The master key encrypting the profiles' keys, which a packaged
          #   API requires: the root .env's DATYX_MASTER_KEY, else one drawn
          #   now. The dev profile empties the database at every start, so
          #   nothing it encrypted outlives this process.
          command: ["sh", "-c"]
          args:
            - |
              [ -n "${DATYX_AITYX_URL:-}" ] || unset AITYX_API_KEY
              [ -n "${DATYX_MASTER_KEY:-}" ] || DATYX_MASTER_KEY="$(head -c 32 /dev/urandom | base64)"
              export DATYX_MASTER_KEY
              exec java -jar /app/quarkus-run.jar
          env:
            - name: DATYX_API_PORT
              value: "9900"
            - name: DATYX_BIND_HOST
              value: 0.0.0.0
            # The Host names the API answers (Quarkus' guard against DNS
            # rebinding, a 400 to any other): this host's, and the Service's,
            # by which the dashboard, HealthHub and OpenMetadata's webhook
            # call it. Without this, the dev profile's image answers the
            # localhost names and host.docker.internal only, its laptop
            # defaults (datyx.catalog.CallbackHostConfigSourceFactory). The
            # probes say localhost.
            - name: QUARKUS_HTTP_HOST_VALIDATION_ALLOWED_HOSTS
              value: localhost,127.0.0.1,[::1],datyx-api,datyx-api.datyx,datyx-api.datyx.svc,datyx-api.datyx.svc.cluster.local
            - name: DATYX_DB_URL
              value: jdbc:postgresql://datyx-postgres:5432/datyx
            - name: DATYX_DB_USER
              value: datyx
            - name: DATYX_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: datyx-passwords, key: DATYX_DB_PASSWORD }
            # OpenMetadata: its Service, for the API's calls; and where
            # this host's browser opens it, which /api/health reports and
            # the dashboard's Health tab links to (the Service's name would
            # make dead links).
            - name: DATYX_OPENMETADATA_URL
              value: http://openmetadata:8585
            - name: DATYX_OPENMETADATA_PUBLIC_URL
              value: http://localhost:19902
            # The catalogue's sign-in to OpenMetadata: its built-in admin.
            - name: DATYX_OPENMETADATA_EMAIL
              value: admin@open-metadata.org
            - name: DATYX_OPENMETADATA_PASSWORD
              valueFrom:
                secretKeyRef: { name: datyx-passwords, key: DATYX_OPENMETADATA_PASSWORD }
            # Where OpenMetadata's webhook posts tables' changes: this
            # Service. The secret it signs with is drawn at each start.
            - name: DATYX_OPENMETADATA_CALLBACK_URL
              value: http://datyx-api:9900/api/catalog/openmetadata-events
            # The dev profile's data sources, HealthHub's PostgreSQL and
            # Kafka, at their Services (a laptop's defaults are the ports
            # HealthHub publishes there, localhost:9803 and :9804): what
            # the catalogue and the training read. The database's password
            # is HealthHub's development one, the API's default.
            - name: DATYX_HEALTHHUB_DB_HOST
              value: healthhub-postgres
            - name: DATYX_HEALTHHUB_DB_PORT
              value: "5432"
            - name: DATYX_HEALTHHUB_KAFKA
              value: healthhub-kafka:19092
            # Google sign-in with the root .env's client, HealthHub's, whose
            # origins list the dashboard's (http://localhost:19906): without
            # a client id it is off, and every call the Local profile. Each
            # Google user gets a profile of their own, made with the dev
            # data's sources (HealthHub's), which the API then catalogues
            # and trains on as it does the Local profile's.
            - name: OIDC_ISSUER
              value: https://accounts.google.com
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: demo-env, key: OIDC_CLIENT_ID, optional: true }
            # aityx: datyx's key and aityx staging's URL, always together
            # (the guard above), and the token services present.
            - name: AITYX_API_KEY
              valueFrom:
                secretKeyRef: { name: demo-env, key: AITYX_API_KEY, optional: true }
            - name: DATYX_AITYX_URL
              valueFrom:
                secretKeyRef: { name: demo-env, key: AITYX_URL, optional: true }
            - name: DATYX_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: { name: demo-env, key: DATYX_SERVICE_TOKEN, optional: true }
            - name: DATYX_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: demo-env, key: DATYX_MASTER_KEY, optional: true }
            # A 384 MB heap; the rest of the limit is libtorch's and
            # XGBoost's native memory (DeepAR's training peaks near 1.2 GB
            # in all, with libtorch's 300 MB of files on top, which count
            # too: at 1536Mi the container stood at its limit), and the
            # JVM's own.
            # Training sized for a machine every demo shares rather than one
            # thread per CPU: four processors for the JVM (XGBoost takes
            # half), four threads for libtorch and OpenMP, and two malloc
            # arenas instead of one per thread.
            - name: JDK_JAVA_OPTIONS
              value: >-
                -Xmx384m -XX:ActiveProcessorCount=4
                -Dai.djl.pytorch.num_threads=4 -Dai.djl.pytorch.num_interop_threads=1
            - name: OMP_NUM_THREADS
              value: "4"
            - name: MALLOC_ARENA_MAX
              value: "2"
          ports:
            - name: http
              containerPort: 9900
          # compose.yaml's healthcheck: ready with PostgreSQL and
          # OpenMetadata, live on its own; up to 10 minutes to start (the
          # schema emptied and migrated, minutes when the machine is busy).
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
              httpHeaders: [{ name: Host, value: localhost }]
            periodSeconds: 3
            failureThreshold: 200
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
              httpHeaders: [{ name: Host, value: localhost }]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
              httpHeaders: [{ name: Host, value: localhost }]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }

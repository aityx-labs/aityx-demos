version: "0.5"

processes:
  1-index:
    # The multyx index page's server (bin/server.mjs); see scripts/serve.sh.
    # The variables are named as the demos' are, so start-all.sh reads
    # the port the same way: the page and its /api/ share one port, 9700,
    # the first of the multyx group's.
    command: bash scripts/serve.sh
    environment:
      - INDEX_PORT=${FLUTTER_WEB_PORT:-9700}
      - API_PORT=${API_PORT:-9700}
      - INDEX_BIND_HOST=${INDEX_BIND_HOST:-127.0.0.1}
    readiness_probe:
      http_get:
        host: localhost
        port: ${FLUTTER_WEB_PORT:-9700}
        path: /api/health
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 5
      failure_threshold: 60
    availability:
      restart: on_failure
      backoff_seconds: 5
